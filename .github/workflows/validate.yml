name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate operator catalog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate spec/operators.json against the schema and the Markdown mirror
        run: npm run validate

      - name: Verify the shopping-cart checkout sample pipeline
        run: npm run sample:checkout
